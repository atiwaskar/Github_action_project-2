name: Java CI + SonarCloud + Auto PR

on:
  push:
    branches:
      - feature
      - feature/**

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Build & Test
      - name: Run Tests
        id: tests
        run: mvn clean verify

      # SonarCloud Scan (FAILS pipeline if quality gate fails)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORG }}

      # 📧 Email ONLY if tests fail
      - name: Send Email on Test Failure
        if: failure() && steps.tests.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          subject: ❌ Java Tests Failed - ${{ github.repository }}
          body: |
            ❌ Java unit tests failed.

            Repo   : ${{ github.repository }}
            Branch : ${{ github.ref_name }}
            Actor  : ${{ github.actor }}

            Run URL:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # 🚀 Auto PR ONLY if everything PASSES
      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Auto PR: CI + Sonar Passed ✅"
          body: |
            ✅ Tests passed
            ✅ SonarCloud quality gate passed

            PR created automatically.
          base: main
          branch: ${{ github.ref_name }}
          commit-message: "Auto PR after CI + Sonar success"
