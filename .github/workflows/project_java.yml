name: Java CI + SonarQube + Auto PR

on:
  push:
    branches:
      - feature/**

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Build & Test
      - name: Run Tests
        id: tests
        run: mvn clean verify

      # SonarQube Scan
      - name: SonarQube Scan
        if: success()
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

      # SonarQube Quality Gate (BLOCK PR if fail)
      - name: SonarQube Quality Gate
        if: success()
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Email if tests fail
      - name: Send Email on Test Failure
        if: failure() && steps.tests.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ❌ Java Tests Failed - ${{ github.repository }}
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            ❌ Java unit tests failed.
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}

      # Auto PR ONLY if everything PASSES
      - name: Create Pull Request
        if: success()
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Auto PR: CI + Sonar Passed ✅"
          body: |
            ✅ Tests passed
            ✅ SonarQube quality gate passed
          base: main
          branch: ${{ github.ref_name }}
