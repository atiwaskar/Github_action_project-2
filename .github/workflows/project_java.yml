name: Java CI with Email Alert

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Run tests
      - name: Run Tests
        id: tests
        run: mvn test

      # Send Email ONLY if tests fail
      - name: Send Email on Test Failure
        if: failure() && steps.tests.outcome == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ❌ Java Tests Failed - ${{ github.repository }}
          to: ${{ secrets.ALERT_EMAIL_TO }}
          from: ${{ secrets.ALERT_EMAIL_FROM }}
          body: |
            ❌ Java unit tests failed.

            Repository : ${{ github.repository }}
            Branch     : ${{ github.ref_name }}
            Triggered  : ${{ github.actor }}
            Workflow   : ${{ github.workflow }}
            Run URL    : https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
